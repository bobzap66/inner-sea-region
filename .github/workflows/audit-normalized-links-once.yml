name: Audit normalized links once

on:
  push:
    branches:
      - main
    paths:
      - "scripts/audit-normalized-link-diff.mjs"
      - ".github/workflows/audit-normalized-links-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Obsidian vault
        uses: actions/checkout@v7
        with:
          repository: bobzap66/inner-sea-region-vault
          path: content
          fetch-depth: 0
          token: ${{ secrets.VAULT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run compatibility normalizer on working copy
        run: node scripts/normalize-content-asset-paths.mjs

      - name: Report source links changed by normalizer
        run: node scripts/audit-normalized-link-diff.mjs content
