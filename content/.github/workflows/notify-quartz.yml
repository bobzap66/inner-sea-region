name: Notify Quartz publisher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Quartz rebuild
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/bobzap66/inner-sea-region/dispatches \
            -d '{"event_type":"vault-updated"}'